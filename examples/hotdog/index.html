<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not Hotdog</title>
<style>
  :root { --green:#27ae60; --red:#c0392b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system, Helvetica, Arial, sans-serif; background:#111; color:#fff; height:100vh; display:flex; flex-direction:column; align-items:center; overflow:hidden; }
  /* header is as wide as the phone, so a vertical recording of the phone captures it too */
  header { width:min(92vw, calc((100vh - 80px) * 9 / 16)); padding:10px 4px; display:flex; align-items:center; justify-content:space-between; font-weight:700; letter-spacing:.5px; flex:0 0 auto; }
  header small { font-weight:400; opacity:.6; font-size:12px; }
  /* phone-shaped portrait stage: as tall as the viewport allows, width follows 9:16 */
  #stage { position:relative; width:min(92vw, calc((100vh - 80px) * 9 / 16)); aspect-ratio:9/16; background:#000; border-radius:34px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 0 8px #1c1c1c, 0 0 0 10px #2b2b2b; flex:0 0 auto; }
  #stage video { width:100%; height:100%; object-fit:cover; display:block; }
  #stage img { width:100%; height:100%; object-fit:contain; display:block; position:relative; }
  #stage #photo { height:calc(100% - 175px); }  /* centre the photo in the area above the dock */
  #stage #bg { position:absolute; inset:-40px; width:calc(100% + 80px); height:calc(100% + 80px); object-fit:cover; filter:blur(28px) brightness(.45); }
  #stage.scanning img, #stage.scanning video { filter:brightness(.7) blur(1px); }
  #scan { position:absolute; inset:0; pointer-events:none; display:none; flex-direction:column; align-items:center; justify-content:center; gap:34px; }
  #stage.scanning #scan { display:flex; }
  .spinner { position:relative; width:130px; height:130px; animation:spin 1.1s steps(12) infinite; }
  .spinner i { position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px; border-radius:50%; background:var(--c); transform:rotate(var(--a)) translateY(-56px); box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .evaluating { font-size:34px; font-weight:900; color:#fff; letter-spacing:.5px; text-shadow:0 0 2px #000, 0 0 6px #000, 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000; }
  @keyframes spin { to { transform:rotate(360deg) } }
  #banner { position:absolute; left:0; right:0; top:0; padding:26px 18px 18px; text-align:center; font-size:34px; font-weight:900; letter-spacing:1px; text-transform:uppercase; transform:translateY(-110%); box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #banner.show { animation:drop .55s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes drop { 0% { transform:translateY(-110%) } 100% { transform:none } }
  #stage.flash-yes { animation:flashg .5s ease-out; } #stage.flash-no { animation:flashr .5s ease-out; }
  @keyframes flashg { 0% { box-shadow:0 0 0 0 rgba(39,174,96,.9), 0 20px 60px rgba(0,0,0,.6) } 100% { box-shadow:0 0 0 30px rgba(39,174,96,0), 0 20px 60px rgba(0,0,0,.6) } }
  @keyframes flashr { 0% { box-shadow:0 0 0 0 rgba(192,57,43,.9), 0 20px 60px rgba(0,0,0,.6) } 100% { box-shadow:0 0 0 30px rgba(192,57,43,0), 0 20px 60px rgba(0,0,0,.6) } }
  #banner.yes { background:var(--green); } #banner.no { background:var(--red); }
  #meter { position:absolute; left:0; right:0; bottom:168px; padding:12px 16px 10px; background:linear-gradient(transparent, rgba(0,0,0,.7)); font-size:14px; }
  #bar { height:10px; border-radius:6px; background:#333; overflow:hidden; margin:6px 0 8px; }
  #fill { height:100%; width:0; background:var(--red); transition:width .25s ease, background .25s ease; }
  #actually { opacity:.9; }
  #drop { position:absolute; inset:0 0 180px 0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; color:#aaa; font-size:18px; }
  .controls { display:flex; gap:10px; margin:4px 0 0; flex-wrap:wrap; justify-content:center; }
  button, label.btn { background:#fff; color:#111; border:0; border-radius:999px; padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  button.secondary, label.btn.secondary { background:#2a2a2a; color:#fff; }
  input[type=file] { display:none; }
  #live.on { background:var(--green); color:#fff; }
  #dock { position:absolute; left:0; right:0; bottom:0; padding:10px 0 16px; background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.92) 30%); }
  #samples { display:flex; gap:10px; overflow-x:auto; padding:6px 14px 10px; scrollbar-width:none; }
  #samples::-webkit-scrollbar { display:none; }
  #samples img { width:76px; height:76px; object-fit:cover; border-radius:14px; cursor:pointer; opacity:.85; border:3px solid transparent; flex:0 0 auto; transition:transform .15s; position:static; }
  #samples img:hover { transform:scale(1.04); }
  #samples img:hover, #samples img.sel { opacity:1; border-color:#fff; }
</style>
</head>
<body>
<header><span>🌭 Not Hotdog</span><small>jevify · gemma4-e4b · one forward pass</small></header>

<div id="stage">
  <div id="drop">Drop a photo here, upload one, or start the camera.</div>
  <video id="video" autoplay playsinline muted hidden></video>
  <img id="bg" hidden alt="">
  <img id="photo" hidden alt="">
  <div id="scan"><div class="spinner"><i style="--a:0deg;--c:#ffffff"></i><i style="--a:30deg;--c:#fde8ec"></i><i style="--a:60deg;--c:#fbd0d9"></i><i style="--a:90deg;--c:#f8b4c2"></i><i style="--a:120deg;--c:#f597aa"></i><i style="--a:150deg;--c:#f27a92"></i><i style="--a:180deg;--c:#ee5d7a"></i><i style="--a:210deg;--c:#ea4062"></i><i style="--a:240deg;--c:#e5234b"></i><i style="--a:270deg;--c:#d81b42"></i><i style="--a:300deg;--c:#c8163a"></i><i style="--a:330deg;--c:#b51233"></i></div><div class="evaluating">Evaluating...</div></div>
  <div id="banner"></div>
  <div id="meter" hidden>
    <div><b id="ptext">P(hot dog) = –</b> <span id="ms" style="float:right;opacity:.6"></span></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="actually"></div>
  </div>
  <div id="dock">
    <div id="samples" title="try one"></div>
    <div class="controls">
      <label class="btn">📷 Upload<input id="file" type="file" accept="image/*" capture="environment"></label>
      <button id="cam" class="secondary">Camera</button>
      <button id="snap" class="secondary" hidden>Classify</button>
      <button id="live" class="secondary" hidden>Live</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $("video"), photo = $("photo"), bg = $("bg"), banner = $("banner"), meter = $("meter"), fill = $("fill");
function setPhoto(src) { photo.src = src; bg.src = src; photo.hidden = false; bg.hidden = false; $("drop").hidden = true; }
let stream = null, liveTimer = null, busy = false;

const stage = $("stage");
function startScan() { banner.className = ""; meter.hidden = true; stage.classList.add("scanning"); }
function show(res) {
  const p = res.hotdog, yes = res.verdict === "HOTDOG";
  stage.classList.remove("scanning");
  banner.textContent = yes ? "Hotdog ✅" : "Not hotdog ❌";
  banner.className = "";            // restart the drop animation even if the class was already set
  void banner.offsetWidth;
  banner.className = "show " + (yes ? "yes" : "no");
  stage.classList.remove("flash-yes", "flash-no"); void stage.offsetWidth; stage.classList.add(yes ? "flash-yes" : "flash-no");
  meter.hidden = false;
  $("ptext").textContent = `P(hot dog) = ${p.toFixed(3)}`;
  $("ms").textContent = `${res.ms} ms · ${res.input_tokens} tokens`;
  fill.style.width = (p * 100).toFixed(1) + "%";
  fill.style.background = p >= 0.5 ? "var(--green)" : "var(--red)";
  const top = res.food_top3.map(([k, v]) => `${k} ${(v * 100).toFixed(0)}%`).join(" · ");
  $("actually").textContent = (res.verdict === "HOTDOG" ? "" : "Actually: ") + top;
}

async function classify(blob, { animate = true } = {}) {
  if (busy) return; busy = true;
  const fd = new FormData(); fd.append("file", blob, "frame.jpg");
  const t0 = performance.now();
  if (animate) startScan();
  try {
    const r = await fetch("/classify", { method: "POST", body: fd });
    const res = await r.json();
    if (animate) await new Promise(ok => setTimeout(ok, Math.max(0, 1400 - (performance.now() - t0))));  // let the scan play
    show(res);
  } catch (e) { stage.classList.remove("scanning"); banner.textContent = "server error"; banner.className = "show no"; }
  busy = false;
}

function frameBlob() {
  return new Promise(res => {
    const c = document.createElement("canvas");
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext("2d").drawImage(video, 0, 0);
    c.toBlob(res, "image/jpeg", 0.85);
  });
}

fetch("/api/samples").then(r => r.json()).then(names => {
  const auto = new URLSearchParams(location.search).get("sample");
  for (const n of names) {
    const im = document.createElement("img"); im.src = "/samples/" + n; im.title = n;
    im.onclick = async () => {
      document.querySelectorAll("#samples img").forEach(x => x.classList.remove("sel")); im.classList.add("sel");
      stopLive(); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; video.hidden = true; }
      setPhoto(im.src);
      await photo.decode().catch(() => {});
      classify(await (await fetch(im.src)).blob());
    };
    $("samples").appendChild(im);
    if (n === auto) im.onclick();
  }
});

$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  stopLive(); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; video.hidden = true; }
  setPhoto(URL.createObjectURL(f));
  photo.decode().catch(() => {}).then(() => classify(f));
};
document.body.addEventListener("dragover", e => e.preventDefault());
document.body.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) { $("file").files = e.dataTransfer.files; $("file").onchange({ target: { files: [f] } }); } });

$("cam").onclick = async () => {
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  video.srcObject = stream; video.hidden = false; photo.hidden = true; bg.hidden = true; $("drop").hidden = true;
  $("snap").hidden = false; $("live").hidden = false;
};
$("snap").onclick = async () => classify(await frameBlob());
function stopLive() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; $("live").classList.remove("on"); $("live").textContent = "Live"; } }
$("live").onclick = () => {
  if (liveTimer) return stopLive();
  $("live").classList.add("on"); $("live").textContent = "Live (stop)";
  liveTimer = setInterval(async () => { if (!busy) classify(await frameBlob(), { animate: false }); }, 400);
};
</script>
</body>
</html>
