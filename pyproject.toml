[project]
name = "jevify"
version = "0.1.0"
description = "Run any local LLM (Ollama, llama.cpp, LM Studio, vLLM, SGLang, transformers) as a Jev-style probabilistic decision API: one prefill, typed probabilities out, zero decode."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kushal Patil" }]
keywords = ["llm", "classification", "calibration", "probabilities", "ollama", "llama.cpp", "vllm", "transformers", "jev", "typesafe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
transformers = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.46", "accelerate>=1.0", "pillow>=10"]
train = ["torch>=2.4", "transformers>=4.46", "accelerate>=1.0", "peft>=0.14", "datasets>=3.0", "numpy"]

[project.urls]
Homepage = "https://github.com/kushalpatil07/jevify"
Issues = "https://github.com/kushalpatil07/jevify/issues"

[project.scripts]
jevify = "jevify.cli:main"

[dependency-groups]
dev = ["pytest>=8", "typesafe-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights / a running server"]
addopts = "-m 'not slow'"
